# ==============================================================================
# FONT CONFIGURATION
# ==============================================================================
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Ukuran font yang disesuaikan agar pas di layar
font_size 10.0

# ==============================================================================
# KEYBINDINGS (TAB NAVIGATION)
# ==============================================================================
# Pindah ke tab sebelumnya dengan Ctrl+Shift+H
map ctrl+shift+h previous_tab

# Pindah ke tab berikutnya dengan Ctrl+Shift+L
map ctrl+shift+l next_tab

# Pintasan tambahan untuk mengelola tab dengan cepat
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# ==============================================================================
# TAB BAR STYLE (Minimalis & Modern)
# ==============================================================================
tab_bar_style        minimal
tab_bar_edge         bottom
tab_title_template   "{index}: {title}"
active_tab_font_style bold
