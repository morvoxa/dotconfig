# 1. Mengubah prefix default dari Ctrl+b ke Ctrl+a (lebih ergonomis)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 2. Membuat shortcut untuk reload konfigurasi tanpa mematikan tmux
unbind r
bind r source-file ~/.tmux.conf \; display-message "Konfigurasi berhasil dimuat ulang!"

# 3. Mengaktifkan dukungan mouse (untuk resize pane, scroll, dan klik tab)
set -g mouse on

# 4. Mengubah indexing window dan pane dimulai dari angka 1 (bukan 0)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# 5. Mengubah shortcut pemisah pane (Splitting) agar lebih intuitif
# Menggunakan | untuk vertikal dan - untuk horizontal
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 6. Navigasi antar pane menggunakan gaya Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 7. Mengatur batas riwayat baris (History Limit) lebih besar
set -g history-limit 10000

# 8. Mengaktifkan mode warna penuh (True Color Support)
set -g default-terminal "screen-256color"
